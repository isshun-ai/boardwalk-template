# Boardwalk board configuration. Replace every CHANGE-ME, then commit.
# Only people edit this file; agents never do.
name: CHANGE-ME                    # the repo name
owner: CHANGE-ME                   # GitHub user or org that owns this repo
maintainers: [CHANGE-ME]           # GitHub users who may change this file, AGENTS.md, schema/, .github/
escalation_user: CHANGE-ME         # GitHub USER who gets emailed when an agent leaves something unhandled
timezone: UTC                      # IANA name, e.g. Asia/Tokyo
agents:                            # keep the tools you use; delete the rest; add read_only: true only to a tool whose connect step found no write tool
  claude-code:
    description: "Claude Code (terminal)"
  codex:
    description: "Codex CLI (terminal)"
  cursor:
    description: "Cursor"
  grok-bot:
    description: "Grok Bot (xAI's agent app) on its cloud computer"
  grok-steward:
    description: "Boardwalk Steward: a dedicated Grok Bot that checks the board and guides you"
  chatgpt:
    description: "ChatGPT via its GitHub connection"
  grok-chat:
    description: "Grok chat (grok.com) via its GitHub connector"
  claude-desktop:
    description: "Claude app (claude.ai / desktop) via a GitHub connector"
wake: []
feeds: []
nudge_after: 3h
