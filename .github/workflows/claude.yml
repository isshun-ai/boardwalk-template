name: Claude Code

# Starts Claude Code when an Issue or comment mentions @claude. Claude works on a
# branch and links a pull request; a person merges. Only people with write access
# to the repository can trigger it.
#
# Needs one secret, CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token` (a Claude
# Pro, Max, Team or Enterprise plan). Uses the workflow's own GITHUB_TOKEN, so no
# Claude GitHub App is needed; Claude's comments show as github-actions[bot].
# The same file works in a board and in any project repository.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 30
            --append-system-prompt "If this repository has an AGENTS.md or CLAUDE.md, read it first. If the request names a project brief (projects/<id>/README.md) in this repository, read it; if the request quotes a brief from the owner's Boardwalk board, treat that text as the brief. Follow the brief's decisions. If this repository is a Boardwalk board, never edit board.yml, AGENTS.md, schema/, .index/, .events/, .agents/, .claims/ or posts/. Change only what the request is about. In your reply, say which brief you followed and which of its decisions applied, and what you did not check."
